# Source catalogue (guide Step 1.4, Appendix F3).
# Actors verified live on 2026-10-04 (fallbacks, LinkedIn and X on 2026-10-07) against the public Apify API:
# public, not deprecated, recent build, 30-day run success, price, input
# fields and output fields. Re-verify before relying on them - actor IDs,
# inputs and prices change.
#
# Each source lists the KINDS of unit the agent may pick (subreddit,
# hashtag, channel, domain, query) and general audience notes. It NEVER
# lists communities, hashtags or domains for a brief or a market: the
# agent decides where to look; tools enforce limits from modes.yaml.
#
# price_usd values are copied from the actor's public pricing on the
# verification date (pay per event). Run budgets live in modes.yaml.
# fields: where each Document field is read from in the actor output.
# author fields are hashed in the same function that reads them.

# Typical latencies, measured on real calls on 2026-10-04 (Step 1.6; one or
# two calls each - re-measure as runs accumulate). Tool descriptions quote them.
tool_latency:
  web_search: "usually 10-20 s"
  fetch_and_segment: "usually 60-90 s for 2-3 pages"
  search_reddit: "usually 40-70 s"
  search_youtube: "usually 60-90 s"
  search_tiktok: "usually 50-120 s"
  search_instagram: "usually 25-60 s"
  search_linkedin: "usually 5-30 s"
  search_x: "usually 5-30 s"
  search_facebook: "usually 10-60 s"
  get_trends: "usually 20-60 s"
  coverage_report: "instant"

verified_on: "2026-10-04"

# actor-check (free: public Apify API, no key): when an actor needs attention. Deprecated actors,
# rental pricing and inputs the actor no longer accepts always fail; the rest warn.
health_check:
  min_success_30d: 0.95         # public runs that succeeded in the last 30 days
  max_success_drop: 0.03        # warn when below the catalog's success_30d by more than this
  min_runs_30d: 100
  min_users_30d: 10
  max_days_since_build: 180     # no new version for longer: maybe abandoned
  min_rating: 3.5               # warn below this average ...
  min_reviews: 5                # ... once it has at least this many reviews

sources:
  reddit:
    kind: apify
    platform: reddit
    tool: search_reddit
    unit_types: [subreddit, query]
    audience: >-
      English-heavy, skews younger and male; strong for candid first-person
      problems, comparisons and "is it worth it" threads. Non-English
      markets often have national subreddits but smaller volume.
    language_country_inputs: none (filter language in the relevance step)
    actor:
      id: harshmaur/reddit-scraper
      memory_mbytes: 512   # actor default
      smoke: ok 2026-10-04 (12/12 text, date, url, votes; posts and comments)
      price_usd: {result: 0.002, init: 0.02}
      success_30d: 0.99
      limit_inputs: [maxPostsCount, maxCommentsCount, maxCommentsPerPost]
      overshoot: billed 12 results with max_items 10 - count items, never trust the cap alone
      date_inputs: [searchTime, postedAfter, postedBefore, commentedAfter]
      date_filter: >-
        postedAfter switches a search to newest-first and ignores searchSort (actor docs,
        2026-10-09): searches use searchTime (week | month | year | all) with relevance;
        subreddit browsing (newest-first anyway) keeps postedAfter
      unit_inputs: {query: searchTerms, subreddit: withinCommunity}
      comments: inline (crawlCommentsPerPost true, maxCommentsPerPost)
      notes: keep aiAnalysis and all mcp* inputs OFF (extra charges)
      fields:                   # posts and comments use different names (dataType)
        text: [title, body]
        date: {post: createdAt, comment: commentCreatedAt}
        url: {post: postUrl, comment: url}
        permalink: {comment: url}
        engagement: [score, upVotes, commentUpVotes, commentsCount]
        author: authorName
    fallback:                   # 2026-10-07: replaces trudax/reddit-scraper-lite (0.86 success, 2.7x the price)
      id: fatihtahta/reddit-scraper-search-fast
      memory_mbytes: 1024   # actor default
      smoke: ok 2026-10-07 (12/12 posts + inline comments, text, ISO date, url, comment permalink; 97 s;
        BUT score and num_comments came back 0 on every item, also on posts with comments)
      price_usd: {result: 0.00149}   # no start fee
      success_30d: 0.986
      limit_inputs: [maxPosts, maxComments]   # per query / per post
      date_inputs: [timeframe, dateFrom, subredditTimeframe, commentDateFrom]
      unit_inputs: {query: queries, subreddit: subredditName (+ subredditKeywords)}
      comments: inline (scrapeComments true, maxComments per post)
      notes: keep sentiment_analysis, content_analysis, maximize_coverage and mcpConnectors OFF
      fields:
        text: [title, body]
        date: created_utc       # ISO
        url: {post: url, comment: postUrl}
        permalink: url
        engagement: []          # score / num_comments always 0 in the smoke test: unknown, never 0
        author: author

  tiktok:
    kind: apify
    platform: tiktok
    tool: search_tiktok
    unit_types: [hashtag, query]
    audience: >-
      Under-35 heavy, trend and slang driven; captions are short, the
      real voice is in the comments (chained actor).
    language_country_inputs: >-
      proxyCountryCode on the primary (add-on "scrape as in country", 0.0013 per video, checked
      2026-10-09); region on the fallback (defaults to GB when not given). Set for single-country briefs.
    actor:
      id: clockworks/tiktok-scraper
      memory_mbytes: 4096   # actor default
      smoke: ok 2026-10-04 (5/5 text, date, url, likes)
      min_max_charge_usd: 0.50  # Apify refuses a lower per-run cap; max_items bounds real cost
      price_usd: {result: 0.0037, actor_start: 0.001, date_filter_per_item: 0.0013}
      addons_per_item: {proxyCountryCode: 0.0013}   # billed only when that input is sent
      date_filter: >-
        hashtag pages return all-time top videos (2021) and ignore
        oldestPostDateUnified; use video search (searchSection /video) with
        videoSearchDateFilter, also for hashtags (verified 2026-10-04, ~2 min)
      success_30d: 0.99
      limit_inputs: [resultsPerPage]
      date_inputs: [oldestPostDateUnified, newestPostDate]
      unit_inputs: {query: searchQueries, hashtag: searchQueries ('#tag')}
      notes: keep all download, AI and transcription inputs OFF
      fields:
        text: [text]
        date: createTimeISO
        url: webVideoUrl
        engagement: [diggCount, commentCount, shareCount, playCount]
        author: authorMeta.name
    fallback:                   # 2026-10-07: replaces apidojo/tiktok-scraper (Free plan = Demo Mode, 10 items)
      id: novi/fast-tiktok-api
      memory_mbytes: 512   # actor default
      smoke: ok 2026-10-07 (8/8 SEARCH with publishTime MONTH, text, unix date, url, likes; 5 s, 0.004 USD;
        no trial or subscription gate)
      price_usd: {result: 0.0004, start: 0.00023}
      success_30d: 0.992
      limit_inputs: [limit]     # a SOFT limit: code counts items
      date_inputs: [publishTime]  # YESTERDAY | WEEK | MONTH | THREE_MONTH | SIX_MONTH (search only)
      unit_inputs: {query: keyword (type SEARCH), hashtag: keyword '#tag' (type SEARCH so the date filter applies)}
      fields:
        text: [aweme_info.desc]
        date: aweme_info.create_time   # unix seconds
        url: aweme_info.share_url -> https://www.tiktok.com/@/video/<aweme_id> (no handle)
        engagement: [statistics.digg_count, statistics.comment_count, statistics.share_count, statistics.play_count]
        author: aweme_info.author.unique_id
    comments:
      actor:
        id: clockworks/tiktok-comments-scraper
        memory_mbytes: 4096   # actor default
        smoke: ok 2026-10-04 (5/5 text, date, url, likes)
        price_usd: {result: 0.00125}
        success_30d: 1.00
        limit_inputs: [commentsPerPost, maxRepliesPerComment]
        input_from_parent: postURLs
        fields:
          text: [text]
          date: createTimeISO
          url: videoWebUrl
          permalink: null       # no comment permalink; cid kept as id
          engagement: [diggCount, replyCommentTotal]
          author: uniqueId
      fallback:                 # 2026-10-07: replaces apidojo/tiktok-comments-scraper (Free plan = Demo Mode)
        id: scrapeforge/tiktok-comments-extractor
        memory_mbytes: 2048   # actor default
        smoke: ok 2026-10-07 (8/8 text, ISO date, video url, comment permalink with cid, likes; 20 s)
        price_usd: {result: 0.0005, actor_start: 0.00005}
        success_30d: 0.994
        limit_inputs: [commentsPerPost]   # 0 means ALL comments: always pass a cap
        input_from_parent: postURLs
        notes: maxRepliesPerComment 0 (replies off)
        fields:
          text: [text]
          date: createTimeISO
          url: videoUrl
          permalink: commentUrl
          engagement: [diggCount, replyCount]
          author: user.uniqueId

  youtube:
    kind: apify
    platform: youtube
    tool: search_youtube
    unit_types: [channel, query]
    audience: >-
      Broad ages; reviews, tutorials and comparisons. Video text is
      creator voice; the audience voice is in the comments (chained).
    language_country_inputs: >-
      none on the primary (query in the target language); the fallback takes regionCode and
      relevanceLanguage, so a non-English single-country brief tries the fallback FIRST (2026-10-09)
    actor:
      id: streamers/youtube-scraper
      memory_mbytes: 1024   # actor default
      smoke: ok 2026-10-04 (5/5 text, date, url, likes)
      price_usd: {result: 0.004, date_filter_per_item: 0.0013}
      date_filter: search needs dateFilter (month | year) - without it 9 of 20 were older than 180 days
      success_30d: 0.99
      limit_inputs: [maxResults, maxResultsShorts, maxResultStreams]
      date_inputs: [dateFilter, oldestPostDate]
      unit_inputs: {query: searchQueries, channel: startUrls}
      notes: keep subtitles, transcription and AI inputs OFF
      fields:
        text: [title, text]
        date: date
        url: url
        engagement: [likes, commentsCount, viewCount]
        author: channelName
    fallback:                   # 2026-10-07: replaces apidojo/youtube-scraper (0.82 success, Free plan = Demo Mode)
      id: grow_media/youtube-search-api
      memory_mbytes: 512   # actor default
      smoke: ok 2026-10-07 (8/8 text, ISO date, url, likes, comments, views; 6 s)
      price_usd: {result: 0.001, actor_start: 0.00005}
      success_30d: 0.9985
      limit_inputs: [maxResults]
      date_inputs: [publishedAfter, publishedBefore]   # exact dates (useFilters true)
      unit_inputs: {query: q}   # search only: channel units have no fallback
      language_country_inputs: regionCode, relevanceLanguage
      notes: says it uses the YouTube Data API, so it may depend on the author's quota
      fields:                   # same names as the primary
        text: [title, text]
        date: date
        url: url
        engagement: [likes, commentsCount, viewCount]
        author: channelName
    comments:
      actor:
        id: streamers/youtube-comments-scraper
        memory_mbytes: 1024   # actor default
        min_max_charge_usd: 0.50
        smoke: ok 2026-10-04 (5/5; dates relative, e.g. '1 day ago')
        price_usd: {result: 0.002}
        success_30d: 0.99
        limit_inputs: [maxComments]
        date_inputs: [oldestCommentDate]
        input_from_parent: startUrls
        fields:
          text: [comment]
          date: publishedTimeText   # relative ("3 weeks ago"); cleaning resolves it
          url: pageUrl
          permalink: pageUrl + "&lc=" + cid
          engagement: [voteCount, replyCount]
          author: author
      fallback:                 # 2026-10-07: replaces apidojo/youtube-comments-scraper (Free plan = Demo Mode)
        id: solidcode/youtube-comments-scraper
        memory_mbytes: 1024   # actor default
        smoke: ok 2026-10-07 (8/8 text, ISO date, video id, likes, replies; 7 s)
        price_usd: {result: 0.00035, actor_start: 0.00005}
        success_30d: 0.992
        limit_inputs: [maxResults]   # per video
        input_from_parent: startUrls
        notes: includeReplies false; ISO publishedAt is worked out from the relative label (English runs)
        fields:
          text: [text]
          date: publishedAt
          url: watch?v=<videoId>
          permalink: watch?v=<videoId>&lc=<commentId>
          engagement: [likeCount, replyCount]
          author: author

  google_trends:
    kind: apify
    platform: null              # external signal, never a Document
    tool: get_trends
    unit_types: [query]
    audience: Search interest over time for any geo; context, not voice.
    language_country_inputs: geo
    actor:
      id: apify/google-trends-scraper
      memory_mbytes: 4096   # actor default; at 1024 it timed out
      bills_per: term           # one item per search term, whole series inside
      smoke: ok 2026-10-04 at 4096 MB (31 points, 38 s, 0.009 USD); the earlier
        timeout ran at 1024 MB
      price_usd: {dataset_item: 0.003}   # PLUS the 4 GB compute, paid by us (~0.009 per term in the smoke)
      success_30d: 0.576        # 2026-10-07: 23% of runs time out; short timeout, then the fallback
      limit_inputs: [maxItems]
      date_inputs: [timeRange]  # no 'today 12-m' (refused): the empty value means past 12 months (2026-10-09)
      unit_inputs: {query: searchTerms}
      fields:
        series: interestOverTime_timelineData
        averages: interestOverTime_averages
    fallback:                   # 2026-10-07: replaces khadinakbar (per data point, ~0.26 USD a term)
      id: scrapesage/google-trends-scraper
      memory_mbytes: 512   # actor default; reads Google's data API, no browser
      bills_per: term           # one item per keyword, whole series inside
      smoke: ok 2026-10-07 (2/2 keywords, geo NL honoured, 93 points each, 8 s, under 0.01 USD)
      price_usd: {result: 0.004}   # "keywordResult"; compute included, no start fee
      success_30d: 1.00         # 1,960 runs; few users (71) and no reviews yet
      limit_inputs: [maxItems]
      date_inputs: [timeRange]
      unit_inputs: {query: searchTerms}
      required_inputs: {mode: keywords, dataTypes: [interestOverTime]}   # fewer data types = cheaper
      fields:
        series: interestOverTime[].value
        keyword: keyword

  instagram:
    kind: apify
    platform: instagram
    tool: search_instagram
    unit_types: [hashtag, query]
    audience: >-
      Visual, lifestyle and brand-heavy; captions are often promotional,
      so comments (chained) carry most of the audience voice.
    language_country_inputs: none (filter language in the relevance step)
    actor:
      id: apify/instagram-hashtag-scraper
      memory_mbytes: 1024   # actor default
      smoke: ok 2026-10-04 (5/5; returns newest posts, often 0 comments)
      price_usd: {result: 0.0026}
      success_30d: 1.00
      limit_inputs: [resultsLimit]
      date_inputs: []           # no date filter; cleaning drops old posts
      unit_inputs: {hashtag: hashtags, query: keywordSearch}
      fields:
        text: [caption]
        date: timestamp
        url: url
        engagement: [likesCount, commentsCount]
        author: ownerUsername
    fallback:                   # 2026-10-07: replaces apify/instagram-scraper (never smoke-tested, 2x the price)
      id: scraping_solutions/instagram-hashtag-scraper-pro-no-cookies
      memory_mbytes: 1024   # actor default
      smoke: ok 2026-10-07 (8/8 feed_type top, caption, ISO date, post url, likes, comment counts > 0; 14 s)
      price_usd: {result: 0.00125}
      success_30d: 0.997
      limit_inputs: [resultsLimit]   # per hashtag
      date_inputs: []           # top posts can be old: cleaning drops them
      unit_inputs: {hashtag: hashtags, query: hashtags (spaces removed)}
      notes: feed_type top returns posts that HAVE comments (the primary's newest posts often have none);
        Free plan - one hashtag per run, up to 5 runs a day
      fields:                   # flat keys with dots in their names
        text: ["caption.text"]
        date: taken_at_date
        url: link_post
        engagement: [like_count, comment_count, play_count]
        author: "user.username"
    comments:
      actor:
        id: apify/instagram-comment-scraper
        memory_mbytes: 1024   # actor default
        smoke: ok 2026-10-04 (5/5 text, date, url, comment permalink, likes)
        price_usd: {comment: 0.0026}
        success_30d: 1.00
        limit_inputs: [resultsLimit]
        input_from_parent: directUrls
        fields:
          text: [text]
          date: timestamp
          url: postUrl
          permalink: commentUrl
          engagement: [likesCount, repliesCount]
          author: ownerUsername
      fallback:                 # 2026-10-07: no-login backup (the slot was empty)
        id: supreme_coder/instagram-comments-scraper
        memory_mbytes: 512   # actor default
        smoke: ok 2026-10-07 (4/4 on 2 photo posts, text, ISO date, comment permalink, likes; 146 s - slow;
          0 comments on a Reel)
        price_usd: {result: 0.001, actor_start: 0.0005}
        success_30d: 0.998
        limit_inputs: [limitPerSource]   # per post
        input_from_parent: urls
        notes: scrapeReplies defaults to TRUE - always pass false; a post without comments gives a placeholder row
        fields:
          text: [text]
          date: timestamp
          url: postUrl
          permalink: commentUrl
          engagement: [likesCount, repliesCount]
          author: ownerUsername

  linkedin:                     # change V6 (PRD DH1): visible to any logged-in user; never private
    kind: apify
    platform: linkedin
    tool: search_linkedin
    unit_types: [query]           # keyword search only - never a person, profile or group (DH8)
    requires_login: true          # evidence.requires_login; the drawer says so
    audience: >-
      Professionals, B2B buyers, founders, installers and trade people;
      posts are often self-promotional, so the comments and first-person
      work stories carry the voice. Many read more than they post.
    language_country_inputs: none (query in the target language; relevance step filters)
    verified_on: "2026-10-07"     # live calls 2026-10-07: 5 posts in 4 s, 10 posts in 5 s, 3 comments in 4 s
    actor:
      id: harvestapi/linkedin-post-search
      needs_session: false        # no cookies or account of ours
      memory_mbytes: 256          # actor default
      smoke: ok 2026-10-07 (5/5 text, date, url, likes; billed 0.010 for 5 posts)
      price_usd: {result: 0.002, actor_start: 0.00005}   # "post" event; comments/reactions/profiles kept OFF
      success_30d: 0.997
      limit_inputs: [maxPosts]
      date_inputs: [postedLimit]  # 24h | week | month | 3months | 6months | year
      unit_inputs: {query: searchQueries}
      notes: keep scrapeComments, scrapeReactions OFF and profileScraperMode short (each is billed)
      fields:
        text: [content]
        date: postedAt.date
        url: id -> https://www.linkedin.com/feed/update/urn:li:activity:<id>/ (linkedinUrl carries the author's name)
        engagement: [engagement.likes, engagement.comments, engagement.shares]
        author: author.name
    fallback:
      id: datadoping/linkedin-posts-search-scraper
      needs_session: false
      memory_mbytes: 128          # actor default
      smoke: ok 2026-10-07 (10/10 text, date, url, reactions; billed 0.006)
      min_items: 10               # 'max_posts must be >= 10'
      price_usd: {result: 0.00155}
      success_30d: 0.988
      limit_inputs: [max_posts]
      date_inputs: [date_filter]  # past-24h | past-week | past-month
      unit_inputs: {query: keywords}
      fields:
        text: [text]
        date: posted_at.date
        url: activity_id -> feed/update URL (post_url carries the author's name)
        engagement: [total_reactions, comments, stats.shares]
        author: author.name
    comments:
      actor:
        id: harvestapi/linkedin-post-comments
        needs_session: false
        memory_mbytes: 256
        smoke: ok 2026-10-07 (3/3 text, date, comment permalink, likes)
        price_usd: {result: 0.002}
        success_30d: 1.00
        limit_inputs: [maxItems]  # per post
        input_from_parent: posts
        fields:
          text: [commentary]
          date: createdAt
          url: postId -> feed/update URL
          permalink: linkedinUrl  # feed/update/...?commentUrn=... (no name)
          engagement: [engagement.likes, engagement.comments]
          author: actor.name
      fallback:                   # 2026-10-07: no-login backup from another vendor (the slot was empty)
        id: datadoping/linkedin-post-comments-scraper
        needs_session: false
        memory_mbytes: 128        # actor default
        smoke: ok 2026-10-07 (10/10 text, date, comment link without names, reactions; 4 s)
        min_items: 10             # 'Minimum is 10 comments' per post
        price_usd: {result: 0.00155}
        success_30d: 0.999
        limit_inputs: [max_comments]   # per post
        input_from_parent: posts
        notes: no date filter (cleaning keeps the window); author.profile_url names the person - never read it
        fields:
          text: [text]
          date: posted_at.date
          url: input (the post we asked for)
          permalink: comment_url  # feed/update/urn:li:ugcPost:...?commentUrn=... (no name)
          engagement: [total_reactions, total_replies]
          author: author.name

  x:                            # X (Twitter), added 2026-10-07: public posts, keyword search only
    kind: apify
    platform: x
    tool: search_x
    unit_types: [query, hashtag]  # keywords or '#tag' - never a person, profile, list or community
    audience: >-
      Real-time reactions, news, tech, politics, sport and fandoms; strong
      for complaints aimed at brands and for professional chatter. Posts are
      short; replies (chained) carry the argument. Many posts are bots,
      giveaways or link spam - the relevance step removes them.
    language_country_inputs: lang (2-letter code on the primary)
    verified_on: "2026-10-07"
    actor:
      id: xquik/x-tweet-scraper
      needs_session: false        # no X login, API key or cookies of ours
      memory_mbytes: 512
      smoke: ok 2026-10-07 (8/8 search with since + lang, text, date, url, likes, replies, views; 6 s;
        replies mode 6/6, 3 s; about 0.0014 USD per 8 posts)
      price_usd: {result: 0.00015}   # plus a little compute paid by us (counted by the settled run cost)
      success_30d: 0.999
      limit_inputs: [maxItems]
      date_inputs: [since, until]   # YYYY-MM-DD
      unit_inputs: {query: searchTerms, hashtag: searchTerms ('#tag')}
      notes: queryType Top; native retweets are excluded by default
      fields:
        text: [text]
        date: createdAt          # "Wed Oct 07 16:01:05 +0000 2026"
        url: id -> https://x.com/i/status/<id> (the actor's own url names the author)
        engagement: [likeCount, replyCount, retweetCount, quoteCount, viewCount]
        author: author.username
    fallback:
      id: scraper_one/x-posts-search
      needs_session: false
      memory_mbytes: 512
      smoke: ok 2026-10-07 (8/8 latest + timeWindow 30, text, unix ms date, url, likes, replies; 8 s)
      price_usd: {result: 0.00025, init: 0.0025}
      success_30d: 0.976
      limit_inputs: [resultsCount]  # Free plan: at most 100 posts per query
      date_inputs: [timeWindow]     # days; works with searchType latest only
      unit_inputs: {query: query, hashtag: query ('#tag')}
      fields:
        text: [postText]
        date: timestamp
        url: postId -> https://x.com/i/status/<id>
        engagement: [favouriteCount, replyCount, repostCount, quoteCount]
        author: author.screenName
    comments:                   # replies to the posts that have some
      actor:
        id: xquik/x-tweet-scraper   # same actor, mode replies
        needs_session: false
        memory_mbytes: 512
        smoke: ok 2026-10-07 (6/6 direct replies, text, date, url, likes; 3 s)
        price_usd: {result: 0.00015}
        success_30d: 0.999
        limit_inputs: [maxItemsPerTarget, maxItems]
        input_from_parent: replyTweetIds
        fields:
          text: [text]
          date: createdAt
          url: rootTweetId -> https://x.com/i/status/<id>
          permalink: id -> https://x.com/i/status/<id>
          engagement: [likeCount, replyCount, retweetCount]
          author: author.username
      fallback:
        id: scraper_one/x-post-replies-scraper
        needs_session: false
        memory_mbytes: 512
        smoke: ok 2026-10-07 (6/6 text, unix ms date, reply url, likes; 16 s)
        price_usd: {result: 0.00025, init: 0.0025}
        success_30d: 0.999
        limit_inputs: [resultsLimit]   # per post; Free plan: 5 posts per run, 100 replies per post
        input_from_parent: postUrls
        fields:
          text: [replyText]
          date: timestamp
          url: inReplyTo -> https://x.com/i/status/<id>
          permalink: replyId -> https://x.com/i/status/<id>
          engagement: [favouriteCount, replyCount, repostCount]
          author: author.screenName

  facebook:                     # added 2026-10-09: public posts by keyword search only
    kind: apify
    platform: facebook
    tool: search_facebook
    unit_types: [query]           # keywords only - never a person, profile, page or named group
    audience: >-
      Broad and older-skewing (35+), parents, homeowners, local communities and hobby groups. Keyword search
      reaches posts in PUBLIC groups, where most of the discussion is; comments (chained) carry the argument.
    language_country_inputs: none used (query in the target language; relevance step filters)
    verified_on: "2026-10-09"     # smoke 2026-10-09 (query "Wärmepumpe Erfahrung", 180 days): 0.044 USD in total
    actor:
      id: scrapeforge/facebook-search-posts
      needs_session: false        # no cookies or account of ours
      memory_mbytes: 256          # actor default
      smoke: ok 2026-10-09 (5/5 posts, all in public groups, all in window, 8-38 comments each; ~5 s; 0.013 USD)
      price_usd: {result: 0.00259, actor_start: 0.00005}
      success_30d: 1.00           # 853k runs; rating 3.63 (10 reviews)
      limit_inputs: [max_results]
      date_inputs: [start_date, end_date]   # YYYY-MM-DD
      unit_inputs: {query: query (search_type posts)}
      fields:
        text: [message]
        date: timestamp           # unix seconds
        url: post_id -> https://www.facebook.com/<post_id> (redirects to the post; no name in it)
        engagement: [reactions_count, comments_count, reshare_count]
        author: author.name
        community: associated_group.name   # the public group it was posted in
    fallback:
      id: scraper_one/facebook-posts-search
      needs_session: false
      memory_mbytes: 256
      smoke: ok 2026-10-09 (5/5 posts, text, unix ms date, likes, comments; mostly personal posts; 0.015 USD)
      price_usd: {result: 0.004, init: 0.00005}
      success_30d: 0.998
      limit_inputs: [resultsCount]  # Free plan: at most 100 posts per query
      date_inputs: [startDate, endDate]   # YYYY-MM-DD
      unit_inputs: {query: query}
      notes: its url names the author (facebook.com/<name>/posts/...) - never read; rebuilt from postId
      fields:
        text: [postText]
        date: timestamp           # unix milliseconds
        url: postId -> https://www.facebook.com/<postId>
        engagement: [reactionsCount, commentsCount, sharesCount]
        author: author.name
    comments:
      actor:
        id: apify/facebook-comments-scraper
        needs_session: false
        memory_mbytes: 4096       # actor default
        smoke: ok 2026-10-09 (6/6 on name-free post links, text, ISO date, comment link, likes; 0.013 USD)
        price_usd: {comment: 0.0025, actor_start: 0.001}
        success_30d: 1.00
        limit_inputs: [resultsLimit]   # per post
        input_from_parent: startUrls
        notes: keep onlyCommentsNewerThan OFF (billed 0.002 per comment; cleaning keeps the window) and
          includeNestedComments off; never read author, profileUrl, profileName or gender
        fields:
          text: [text]
          date: date
          url: inputUrl (the name-free post link we sent)
          permalink: facebook.com/<post id>?comment_id=<commentId>
          engagement: [likesCount, commentsCount]   # likesCount arrives as a string
          author: profileName
      fallback:
        id: thedoor/facebook-comment-scraper
        needs_session: false
        memory_mbytes: 4096       # actor default
        smoke: ok 2026-10-09 (6/6 text, ISO date, name-free comment link; 0.003 USD)
        price_usd: {result: 0.0005, actor_start: 0.00005}
        success_30d: 0.998
        limit_inputs: [targetComments]   # per post
        input_from_parent: postUrls
        notes: includeReplies and includeReactions off
        fields:
          text: [text]
          date: comment_time
          url: post_url
          permalink: comment_url  # facebook.com/<post id>?comment_id=<id> (no name)
          engagement: [replies_count]
          author: author_name

  web_forums:
    kind: web
    platform: web_forum
    tool: web_search + fetch_and_segment
    unit_types: [domain, query]
    audience: >-
      Local-language forums and Q&A sites; often the best first-person
      voice in non-English markets. Login pages and JavaScript-only pages
      are skipped and logged.
    language_country_inputs: query language + country in the search prompt
  web_reviews:
    kind: web
    platform: web_review
    tool: web_search + fetch_and_segment
    unit_types: [domain, query]
    audience: Review sites and retailer reviews; ratings plus objections.
    language_country_inputs: query language + country in the search prompt
  web_editorial:
    kind: web
    platform: web_editorial
    tool: web_search + fetch_and_segment
    unit_types: [domain, query]
    audience: News and articles; context only, never counted as audience voice.
    language_country_inputs: query language + country in the search prompt

# Never web-searched or read with fetch_and_segment (2026-10-09 audit: web searches like "reddit ... thread"
# and "quora ..." gave nothing - these sites refuse or need JavaScript/login). A general rule for every brief,
# NOT a per-brief source list. domain (subdomains included) -> what to use instead.
web_skip_domains:
  reddit.com: search_reddit
  redd.it: search_reddit
  tiktok.com: search_tiktok
  youtube.com: search_youtube
  youtu.be: search_youtube
  instagram.com: search_instagram
  linkedin.com: search_linkedin
  x.com: search_x
  twitter.com: search_x
  facebook.com: nothing (login wall)
  quora.com: nothing (login wall, JavaScript)

# Rules for collect/apify.py (Step 1.6), learned from the 2026-10-04 smoke test.
call_rules:
  budget_check: >-
    Check the remaining budget against the EXPECTED cost (items x price +
    start fee from this file), not against max_charge. Some actors refuse
    a per-run cap below min_max_charge_usd (0.50); that cap is only a
    last-resort ceiling.
  count_items: >-
    Actors can return more than max_items (reddit billed 12 of 10). Count
    items in code, keep at most the limit, and keep a 20% cost margin.
  final_cost: >-
    usageTotalUsd settles after the run ends (seen as 0 at first). Re-read
    the run after it finishes and record that billed cost.
  chain_comments: >-
    Only chain comment actors on posts with a comment count above 0,
    highest first. Newest posts (instagram hashtag) often have none.
  missing_engagement: >-
    An actor with no engagement fields (engagement: []) gives unknown
    engagement (null percentile), never 0.
  optional_sources: >-
    google_trends is context only: short timeout (about 120 s), never
    blocks a run, at most actor then fallback.
  memory: Always pass memory_mbytes from this file.

web_pricing_note: >-
  web search about USD 10 per 1,000 searches plus tokens; web fetch is
  tokens only (re-check current Anthropic prices before a paid run).

