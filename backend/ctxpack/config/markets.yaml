# Geography for markets and languages (change V2, PRD FR-A2b). THIS FILE IS THE SOURCE OF TRUTH.
# Geography only: regions -> countries, countries -> names and official languages. It never lists
# sources (communities, hashtags, sites) for a market - the agent decides where to look (PRD D10).
#
# names: lower-case words that mean the place in a brief (English and local). A brief naming one of
# them is never interpreted as "global" (checked in code).
# languages: ISO 639-1, most spoken first. Languages outside modes.yaml languages.supported are
# shown as excluded ("not supported yet").

regions:
  eu:
    name: Europe
    names: [europe, european, europa, europe-wide, eu, emea, europäisch, europese, européen, européenne, europeo, europea, europeu, europejski]
    countries: [DE, FR, IT, ES, PL, NL, BE, SE, AT, DK, FI, "NO", IE, PT, CZ, RO, HU, GR, CH, GB, SK, BG, HR, SI, LT, LV, EE, LU]
  dach:
    name: DACH
    names: [dach, d-a-ch, german-speaking]
    countries: [DE, AT, CH]
  benelux:
    name: Benelux
    names: [benelux, low countries]
    countries: [NL, BE, LU]
  nordics:
    name: Nordics
    names: [nordics, nordic, scandinavia, scandinavian, norden, skandinavien, pohjoismaat]
    countries: [SE, DK, "NO", FI, IS]
  cee:
    name: Central and Eastern Europe
    names: [cee, central and eastern europe, central europe, eastern europe, mittel- und osteuropa, europa środkowo-wschodnia]
    countries: [PL, CZ, SK, HU, RO, BG, HR, SI, LT, LV, EE]

