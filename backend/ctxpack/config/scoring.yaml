# Confidence (PRD 5.4) and opportunity (PRD 5.5) scoring.
# THIS FILE IS THE SOURCE OF TRUTH. Any recalibration goes here AND into
# the decision log, and is shown in the pack's Method section.

confidence:
  weights:
    volume: 0.30
    authors: 0.25
    cross_platform: 0.20
    engagement: 0.10
    recency: 0.10
    verifier: 0.05
  saturation:                   # component = min(1, value / divisor)
    volume_members: 12          # volume = min(1, members / 12)
    authors: 8                  # authors = min(1, distinct_authors / 8)
    cross_platform_extra: 2     # cross_platform = min(1, (platforms - 1) / 2)
  recency_if_undated: 0.5       # an undated member counts this much in recency (owner's change 2026-10-09)
  engagement_if_unknown: 0.0    # no engagement data (e.g. forums): no credit. PRD 5.4 is silent (owner to confirm)
  verifier_values:
    supported: 1.0
    partially_supported: 0.5
  labels:                       # highest level whose threshold AND gates pass
    strong:
      min_score: 0.75
      min_members: 8
      min_authors: 5
      min_platforms: 2
      require_supported: true
    moderate:
      min_score: 0.50
      min_members: 4
      min_sources: 2
    emerging:
      min_score: 0.30
    speculative:
      min_score: 0.0
  caps:
    single_author_share_max: 0.50   # above this -> at most emerging
    single_author_cap_label: emerging
    thin_evidence_cap_label: emerging
    undated_share_max: 0.50       # more members undated than this -> at most undated_cap_label (2026-10-09)
    undated_cap_label: moderate
    partially_supported_levels_down: 1   # and claim_type becomes inferred

opportunity:
  demand_percentile: 90         # demand = min(1, members / P90 of member counts)
  novelty_non_obvious: 1.0
  novelty_obvious: 0.4
  # score = demand x dissatisfaction x novelty x (1 - saturation)

# Metrics (guide Step 3.2). Code only, from VERIFIED members; short_form posts never counted.
metrics:
  platform_lens_min_docs: 15    # a platform gets a lens only with this many relevant posts
  momentum_min_dated: 30        # rising / stable / fading only with this many dated members ...
  momentum_min_weeks: 8         # ... spread over at least this many weeks ...
  momentum_change: 0.20         # ... a change of more than this between the first and last third ...
                                # ... AND Google Trends agrees; otherwise insufficient_data
  whats_new_days: 30
  whats_new_min_members: 3      # members dated in the last 30 days
  whats_new_min_ratio: 2.0      # their share of the cluster vs the share of all dated posts that are that new
  what_performs_max: 10
  what_performs_per_author: 2
  what_performs_per_thread: 1
  competitor_min_mentions: 3
  item_emotion_min_share: 0.20  # an item lists an emotion only if this share of its members shows it (max 3)
  coverage_grade:               # highest grade whose minimums all pass; otherwise d
    a: {min_platforms: 4, min_kept: 300, all_languages: true}
    b: {min_platforms: 3, min_kept: 200, all_languages: false}   # b and c: not in the guide (owner to confirm)
    c: {min_platforms: 2, min_kept: 100, all_languages: false}

# Consolidation (change V4, PRD 6.1b): every finding once, in the section whose job fits it best.
# Score = 0.6 x claim-word overlap + 0.4 x shared evidence (calibrated on the NL and Gen Z drafts:
# true repeats scored 0.88-1.0; related-but-different findings 0.2-0.5).
consolidation:
  text_weight: 0.6
  merge_at: 0.75              # at or above: the same finding, merged in code
  borderline_from: 0.35       # from here up to merge_at: one small model call decides
  borderline_max_pairs: 30    # at most this many pairs go to the model (highest scores first)
  relation_min_shared_docs: 1 # items in other sections sharing at least this many posts are linked
  relations_max: 3            # links per item
  # The section that keeps a repeated finding: the most specific job first.
  home_order: [tensions, objections, pain_points, white_space, motivations, themes]

# Opportunities you can trust (change V5, PRD 6.1c). Counts are code; a signal is at most emerging.
opportunities:
  supported_min_authors: 3
  supported_min_communities: 2

# Data quality (data audit): below this share of dated relevant posts, the pack says so as a blind spot.
data_quality:
  dated_share_warn: 0.5

# Brand perception (change V12): only for the brand_perception goal. Below brand_min_mentions there are no
# findings ("too few mentions to judge"); unprompted = found by a search that did not name the brand.
brand:
  min_mentions: 5               # posts naming the brand before findings are written
  min_unprompted: 3             # below this, low unprompted awareness is reported as the awareness note
  findings_max: 5
  member_texts_max: 25          # brand posts the writer reads (most engaged first)
  aspects_max: 5                # praised / criticised aspects listed per brand

# Plain words for the pack page, "How to read this" and every badge tooltip (change V9).
# good_enough_to: what a marketer can safely use a finding for at that label.
plain_labels:
  strong:
    words: "Strong - many different people in several communities say this"
    good_enough_to: "commit budget"
  moderate:
    words: "Moderate - a clear pattern, from a fair number of people"
    good_enough_to: "brief creative"
  emerging:
    words: "Emerging - a few people say this; worth testing"
    good_enough_to: "test a post"
  speculative:
    words: "Early signal - only one or two people; check before acting"
    good_enough_to: "explore, not act on yet"
plain_claim_types:
  observed: "seen in posts"
  inferred: "our interpretation of the posts"
  external: "from outside sources"
grade_cap_thin: c               # a thin-evidence pack never shows a grade above this
