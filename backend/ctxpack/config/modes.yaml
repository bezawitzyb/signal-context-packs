# Per-run limits (guide B8d, PRD 8.5). THIS FILE IS THE SOURCE OF TRUTH.
# Enforced in collect/tools.py - never only in a prompt.

modes:
  quick:
    max_tool_calls: 15
    collection_secs: 300
    apify_usd: 1.80
    llm_usd: 1.40               # collection: plan + agent loop + tools
    analysis_llm_usd: 1.40      # after collection: extraction, clustering, writing, verifying, playbook (1.00 -> 1.40: V4-V7 steps)
    unit_share_max: 0.30        # share of item_budget per source unit
    min_relevant: 60
    item_budget: 600            # raw items per run
    items_per_call_max: 40
    web_pages_per_call_max: 5
    typical_usd: [1.50, 3.00]   # shown on the plan (PRD NFR2); the hard cap is apify_usd + llm_usd + analysis_llm_usd
    typical_minutes: 7          # end to end (PRD NFR1)
  standard:
    max_tool_calls: 30
    collection_secs: 600
    apify_usd: 4.00
    llm_usd: 3.50
    analysis_llm_usd: 2.50
    unit_share_max: 0.30
    min_relevant: 200
    item_budget: 2000
    items_per_call_max: 80
    web_pages_per_call_max: 8
    typical_usd: [5.00, 7.00]
    typical_minutes: 12

default_mode: quick

# Goals per pack (change V12, PRD FR-A2e): more are listed as left out with the reason. Same for both modes.
goals:
  max: 3

# Clarifying questions (change V3, PRD FR-A2c; V11 FR-A2d): asked before planning, never of agents.
# Goals and offer count towards max_questions; options_max is for the model's own questions
# (the fixed goal chips come from goals.yaml).
clarifying:
  max_questions: 4
  options_min: 3
  options_max: 5

# Languages (change V2, PRD FR-A2b): chosen in code from the markets' official languages (weighted)
# plus English, only from this list, at most max_per_mode. The rest is shown as excluded with a reason.
languages:
  supported: {en: English, de: German, nl: Dutch, fr: French, it: Italian, es: Spanish, pl: Polish,
              sv: Swedish, da: Danish, nb: Norwegian, fi: Finnish, pt: Portuguese}
  max_per_mode: {quick: 4, standard: 6}
  english_weight: 0.15          # English joins global and multi-country runs with at least this share (lingua
                                # franca); a single-country brief only when the planner picks it (2026-10-09)
  model_language_bonus: 0.10    # a language the planner picked for this brief gets this extra share
  named_country_weight: 0.30    # a country the brief names gets this extra weight; its main language is always kept
  min_share_of_top: 0.25        # a market language scoring below this share of the top language is left out
# Starting plan (change V6): no platform above this share of the planned starting units unless the plan
# says why (source_balance_reason); otherwise code switches the extra units off (the user can switch them on).
planning:
  source_share_max: 0.5

parallel_tool_calls_max: 3      # concurrent tool calls from one model turn
queue_max: 3                    # runs waiting behind the live one (FIFO)
time_window_days_options: [30, 90, 180, 365]
default_time_window_days: 180

# Cleaning chain (guide Step 1.5, PRD FR-C2). Same for every mode.
cleaning:
  short_form_max_words: 3       # posts under 4 words: short_form (lexicon only)
  shingle_words: 5              # MinHash shingles of 5 words
  minhash_threshold: 0.8        # near-duplicate Jaccard threshold
  minhash_num_perm: 128
  spam_max_hashtags: 8          # more than this in one post = hashtag flood
  spam_flood_share: 0.5         # hashtags or emoji above this share of tokens
  relevance_batch_size: 30      # docs per worker call (F4-5)
  relevance_parallel_max: 5     # worker calls at once

# Extraction (guide Step 3.1, PRD FR-C3, prompt F4-6). Same for every mode.
extraction:
  batch_docs_max: 30            # relevant docs per worker call (guide: 20-40)
  batch_chars_max: 8000         # long forum posts: fewer per call, so text_en fits the answer
  parallel_max: 5               # worker calls at once
  max_tokens: 12000             # one call's answer (fields + English translations)
  phrases_max: 6                # verbatim phrases kept per doc (exact substrings only)

# Clustering + membership check (guide Step 3.2, prompts F4-7 and F4-9). Same for every mode.
clustering:
  digest_max_chars: 240000      # all digests in ONE reasoner call (~70k tokens); summaries shrink to fit
  digest_summary_chars: 160     # per-doc summary in the digest (shortened first when over the max)
  max_tokens: 16000             # the clustering answer (member id lists)
  membership_batch_docs_max: 30 # posts per membership call (one cluster per call)
  membership_batch_chars_max: 12000
  membership_parallel_max: 5
  membership_text_chars: 1000   # each post is cut to this length for the yes/no check

# Baseline + synthesis (guide Step 3.3, prompts F4-8, F4-10, F4-9 non_obvious). Same for every mode.
synthesis:
  evidence_per_call_max: 60     # numbered evidence items per writer call (guide ~40; call A needs one per lexicon term)
  evidence_per_cluster_max: 3   # taken round-robin over the call's clusters, biggest first
  evidence_chars: 280           # evidence excerpt length (pack schema max)
  max_tokens: 16000             # one writer answer
  perform_max_tokens: 3000      # follow-up for top posts call B left undescribed (it skipped them in long answers)
  opportunities_max: 6          # opportunity texts written (top by score)
  non_obvious_batch: 60         # items per non_obvious worker call

# Opportunities (change V5, PRD 6.1c): one web search per opportunity for existing solutions.
opportunities:
  searches_max: 4               # opportunities checked by web search per pack (the rest: "not searched")
  solutions_max: 3              # existing solutions listed per opportunity

# News hooks and timing (change V7, PRD 6.1d): one web search step after collection; nothing without a URL.
news:
  lookback_days: 30             # news, regulation and events from this many days ago ...
  lookahead_days: 90            # ... up to this many days ahead (trade fairs, deadlines)
  max_hooks: 5
  searches_max: 3               # web searches in the one news call
  timing_per_channel_max: 4     # timing chips per channel card
  time_mention_min_posts: 2     # a weekday / season / time of day becomes a chip from this many posts

# Post briefs, drafts and the content calendar (change V8, PRD 6.1e). Written in the playbook stage.
posts:
  briefs_min: 5                 # fewer survive the checks -> said in the playbook check, never padded
  briefs_max: 8
  key_points_min: 3             # a brief with fewer valid key points is dropped
  key_points_max: 5
  evidence_per_key_point: 2     # evidence ids taken from each key point's items (code)
  drafts: 3                     # full drafts for the first briefs
  draft_max_tokens: 8000        # the drafts call's answer
  draft_chars: {text_post: 1300, carousel: 1500, short_video: 900, blog_article: 4000, newsletter: 2500}
  calendar_weeks: 4
  posts_per_week_default: 2     # a channel whose plan gives no cadence
  posts_per_week_max: 7
  calendar_days: [tuesday, thursday, monday, wednesday, friday, saturday, sunday]  # fallback day order

# "Ask this pack" (change V10, PRD 6.1g): a read-only chat over one pack. Every answer counts against
# DAILY_SPEND_CAP_USD. Asking needs a key (owner's decision, 2026-10-09): the run key has no question limit;
# the guest key has these per UTC day (counted in memory; a visitor is a salted hash of the address).
ask:
  max_tool_calls: 6             # reads of the pack per answer (get_pack_view, get_insight, search_evidence)
  max_usd: 0.10                 # per answer: no new model turn starts once this is spent
  guest_questions_per_pack: 5     # guest key: questions per pack per day
  guest_questions_per_visitor: 15  # guest key: questions per visitor per day, across all packs
  max_tokens: 1500              # one model turn
  history_max: 6                # earlier turns sent with a follow-up question
  question_max_chars: 500
  evidence_per_read: 5          # posts returned by one get_insight or search_evidence read
  suggested: 4                  # suggested questions on the panel (built in code, no call)

# Verification (guide Step 3.4, prompt F4-9 claim mode). Same for every mode.
verification:
  claim_batch_items: 12         # claims per worker call (each with up to 5 evidence excerpts)
  claim_parallel_max: 5

# Minimum content bar (PRD 6.6). Not met -> thin-evidence pack (said plainly, never padded).
content_bar:
  quick:    {lexicon: 8,  tensions: 2, hooks: 6,  objections: 3, opportunities: 3, white_space: 2, what_performs: 3, channel_plan: 3}
  standard: {lexicon: 15, tensions: 3, hooks: 10, objections: 5, opportunities: 3, white_space: 2, what_performs: 5, channel_plan: 3}
  tension_min_evidence: 3       # a tension counts with >= 3 evidence from >= 2 sources
  tension_min_sources: 2
  digest_max_chars: 2000        # ~500 tokens

# Exports (guide Step 3.6, PRD 6.7, 11.2). Token counts are estimated as chars / chars_per_token.
exports:
  chars_per_token: 3.0          # conservative for Dutch/German (English is nearer 4)
  digest_view_max_tokens: 1600  # PRD 11.2 says 500, but guardrails + agent rules alone are ~600 (never cut);
                                # 1600 estimated (~1,100 real tokens) fits 5 truths, 3 actions, 3 tensions, 8 words
  prompt_block_max_tokens: 1800
  skill_body_max_tokens: 2000   # PRD 6.7 (Anthropic allows < 5k; ours is stricter)
  skill_name_max_chars: 64      # Anthropic SKILL.md rules (checked 2026-10-05)
  skill_description_max_chars: 1024
  words_per_page: 450           # V9: length labels on the hand-off options ("about 2 pages")
  quick_brief_max_words: 250    # V9: the half-page quick brief

# Collection tools (guide Step 1.6, B8). Same for every mode.
collection:
  actor_timeout_secs: 180       # actor stops itself; partial items are kept
  actor_min_secs: 20            # never start an actor (or its fallback / comments) with less time left
  trends_timeout_secs: 120      # trends is optional context: give up fast
  cost_margin: 0.20             # actors can overshoot max_items (reddit 12 of 10)
  chain_parent_posts_max: 3     # comments are fetched for at most this many posts
  chain_posts_share: 0.4        # share of a call's item limit spent on posts
  trends_points_max: 30         # trends bills per data point (0.005 each)
  cache_hours: 24               # PRD DH2
  samples_max: 3                # samples in a tool summary
  sample_chars: 200
  new_terms_max: 8
  web_search_max_uses: 2        # searches per web_search call (3 -> 2: results are ~half of a run's cost)
  anchor_words: 4               # words per text-fragment anchor (DH12)
  segment_max_chars: 10000      # a post cut from start/end words is never longer than this
  blocked_site_days: 30         # a site that refused web fetch (url_not_allowed) is skipped this long
  blocked_sites_max: 50         # at most this many are passed to web search as blocked_domains
  site_failures_max: 2          # pages from one site that failed (bot wall, rate limit) or showed no posts
                                # (JavaScript-only): after this many the site is skipped for the rest of the run
  web_fetch_max_content_tokens: 20000  # caps the cost of one huge page (~0.02 USD input)
  probe_items: 20               # the first social call on a platform is a small test (2026-10-09 audit: full-size
                                # first calls cost 60 posts at 0-11% relevant); also every subreddit browse without a query
  probe_min_relevant_share: 0.30  # a search that proved at least this relevant gets full size when repeated
  probe_trusted_platform_share: 0.70  # a NEW search starts full size only on a platform at least this relevant ...
  probe_trusted_min_searches: 2       # ... over at least this many searches (NL rerun: one 79% search let a 16% in)
  groups_listed_max: 5          # public Facebook groups a search result lists for read_facebook_group

# Agent loop (guide B8a, B8e). Same for every mode.
agent:
  turn_max_tokens: 4096         # one reasoner turn (tool calls + short reasons)
  code_verdict_keep_share: 0.30 # units the agent gave no verdict: kept if at least this share is relevant
  crash_fallback_extra_secs: 90 # after a timeout without finish(), the crash fallback may use this much more time
  top_up_extra_secs: 90         # a low-evidence top-up may run this long past the collection time (2026-10-09:
                                # the agent uses its whole time, so without it every top-up call was refused)
  top_up_pages_per_unit: 3      # web top-up: unfetched pages per kept domain, from earlier web_search results
  top_up_fuller_min_share: 0.60 # a fuller page of the same search only when that search was at least this relevant

# Job worker (guide B13) and live events (B6). Same for every mode.
worker:
  heartbeat_secs: 20            # a working run updates heartbeat_at this often
  stale_after_secs: 120         # no heartbeat for this long -> "interrupted"
  interrupted_check_secs: 60    # how often the worker looks for interrupted runs
  retention_check_secs: 3600    # how often expired posts are deleted (also at every start)
  schema_wait_secs: 30          # database routes wait this long for the start-up migration, then answer 503
  statement_timeout_secs: 60    # set on the database role by migration 001 (Postgres)
  poll_secs: 2                  # idle worker checks the queue this often
  max_resumes: 1                # an interrupted run is resumed at most once
  thin_evidence_floor: 20       # relevant docs needed for a pack; below it the run ends on the thin screen (V1)
  thin_evidence_floor_offline: 10  # offline mode only (recorded sample data, fake model; never on Render)
  step_attempts: 2              # an analysis or packaging step is tried this often before the evidence-only pack
  evidence_only_max: 40         # posts shown in an evidence-only pack (most engaging, then newest)
  thin_offtopic_share: 0.2      # thin reasons (V1): relevant share of kept posts below this = mostly off topic
  thin_old_share: 0.4           #   out-of-window share of collected posts above this = mostly too old
  thin_language_share: 0.3      #   share of kept posts in the brief's languages below this
  thin_few_collected: 30        #   fewer posts collected than this = very little public talk
events:
  poll_secs: 1                  # SSE reads new rows from the events table this often
  ping_secs: 15                 # SSE heartbeat
