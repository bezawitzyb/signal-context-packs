# Goals and offer stages (change V11, PRD FR-A2d; V12 goal-driven pack). What the research is FOR and
# how far the user's offer is. Ids are the enum values in schemas/enums.py (Goal, OfferStage); chips are
# the answer chips shown to the user, in this order. The goal and offer questions are built in code from
# this file when the planning call leaves them out. No sources, markets or numbers live here.
#
# V12: lead = the pack sections that come first for the goal, in order (section ids as on the pack page:
# their-words, want-stops, segments, generic, landscape, brand, plan, channels, performs, opportunities,
# guardrails). Code builds the pack's section_order from the ranked goals (main goal's lead first, then the
# next goal's, then the rest in default_order). needs = work only this goal pays for.

default_order: [their-words, want-stops, segments, generic, landscape, brand, plan, channels, performs,
                opportunities, guardrails]

goals:
  content_plan:
    chip: Content plan
    description: post ideas, drafts and a content calendar
    lead: [plan, their-words, channels, performs]
  campaign_launch:
    chip: Campaign launch
    description: a campaign or launch message and its timing
    lead: [plan, want-stops, channels, their-words]
  positioning:
    chip: Positioning
    description: a clear message and how you compare with competitors
    lead: [want-stops, their-words, landscape, opportunities, guardrails]
  product_validation:
    chip: Product validation
    description: whether there is real demand or an unserved need
    lead: [opportunities, want-stops, segments, generic]
  market_entry:
    chip: Market entry
    description: how a new country or region talks, buys and decides
    lead: [landscape, their-words, channels, segments]
  brand_perception:
    chip: Brand perception
    description: how people see your brand and tell it apart
    lead: [brand, landscape, want-stops, their-words]
    needs: [brand_perception]
  sales_enablement:
    chip: Sales
    description: objections and buyer language for sales conversations
    lead: [want-stops, segments, their-words, guardrails]
  understand_audience:
    chip: Just understand the audience
    description: a broad picture of the audience with no specific output in mind
    lead: [their-words, want-stops, segments, generic, landscape]

offer_stages:
  idea:
    chip: An idea - testing demand
  launching:
    chip: Launching soon
  selling:
    chip: Already selling
  no_offer:
    chip: No offer of my own (agency, client work or exploring)

questions:
  goal:
    question: What will you use this research for?
    why_it_helps: "Your goal decides what the pack focuses on: a message, post ideas, a go/no-go, or sales answers."
  offer:
    question: What do you offer, and how far along is it?
    why_it_helps: We look for the doubts and objections that matter to your offer, and the advice changes with its stage.
    placeholder: What you sell or plan to sell, in a few words
  brand:
    question: Which brand should we listen for?
    why_it_helps: Brand perception needs the name people use for your brand, and the parent brand if you want to know whether they tell the two apart.
    placeholder: Your brand, as people write it
    parent_placeholder: Parent brand (optional)
