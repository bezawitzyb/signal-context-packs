[project]
name = "ctxpack"
version = "0.1.0"
description = "SIGNAL - Context Packs: audience research packs for people and AI agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.11.0",
    "apify-client>=3.2.1",
    "datasketch>=2.0.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlmodel>=0.0.47",
    "sse-starlette>=3.5.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctxpack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["transcripts: replay the recorded agent transcripts in fake mode"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# Lint (audit, 2026-10-09): bugs and unused code only; style is left to review. Run in CI.
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = [
    "B008",  # typer.Option(...) in defaults is how typer works
    "B905",  # zip() without strict=: lengths are equal by construction; strict would only add a crash path
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # pytest fixtures are imported and then named as test parameters
