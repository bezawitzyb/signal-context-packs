# gitleaks config: all of gitleaks' built-in rules (Anthropic, AWS, GitHub,
# private keys, generic API keys, ...) PLUS project-specific rules below.
title = "signal-context-packs gitleaks config"

[extend]
useDefault = true

# RUN_KEY is our own password for starting runs; gitleaks does not know it,
# so flag ANY value assigned to it (8+ characters, quoted or not).
# Blank templates (RUN_KEY=) and placeholders (<YOUR_KEY>, $RUN_KEY) pass.
[[rules]]
id = "signal-run-key"
description = "SIGNAL RUN_KEY value"
regex = '''(?i)\bRUN_KEY[ \t]*=[ \t]*["']?([^\s"'#]{8,})'''
secretGroup = 1
keywords = ["run_key"]

[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^<[A-Za-z_]+>$''', '''^\$''']

# Same idea for the author-hash salt: any real value is a secret.
[[rules]]
id = "signal-author-hash-salt"
description = "SIGNAL AUTHOR_HASH_SALT value"
regex = '''(?i)\bAUTHOR_HASH_SALT[ \t]*=[ \t]*["']?([^\s"'#]{8,})'''
secretGroup = 1
keywords = ["author_hash_salt"]

[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^<[A-Za-z_]+>$''', '''^\$''']
